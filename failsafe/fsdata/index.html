<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>MT7621DA 固件恢复</title>
<link rel="stylesheet" href="/style.css">
<header>MT7621DA 固件恢复</header>
<main>
<h1>固件升级</h1>
<p>请选择本机 8 MiB OpenWrt 固件（最多 7,872 KiB）。</p>
<form action="/upload" method="post" enctype="multipart/form-data">
<input type="file" name="firmware" aria-label="固件文件" required>
<button>上传并核对</button>
</form>
<h2>设备维护</h2>
<p><a href="/backup">下载 SPI Flash 整片备份（8 MiB）</a></p>
<form action="/restore" method="post" enctype="multipart/form-data">
<input type="hidden" name="confirm" value="TTTTTTTT">
<label><input type="checkbox" name="erase" value="1" required>确认清除 OpenWrt 设置和自行安装的软件包</label>
<button>恢复出厂设置</button>
</form>
<form action="/reboot" method="post" enctype="multipart/form-data">
<input type="hidden" name="confirm" value="TTTTTTTT">
<button>重启设备</button>
</form>
</main>
